<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stoka Habita - Prototipo de referencia</title><style>html{color-scheme:light}body{margin:16px auto;max-width:1200px;padding:0 12px}</style></head><body><div id="habita-ui" aria-label="Habita · Gestión del condominio">
<style>
#habita-ui{--h-bg:light-dark(#f3f6f5,#141c20);--h-surface:light-dark(#fff,#202b30);--h-ink:light-dark(#20352f,#e7efeb);--h-dim:light-dark(#60736d,#aec0b8);--h-line:light-dark(#dfe7e2,#3a4841);--h-green:light-dark(#12684e,#89d8b6);--h-tint:light-dark(#eaf4ee,#243d31);--h-warn:light-dark(#fff2df,#433420);--h-warntext:light-dark(#875118,#ffd69b);--h-radius:14px;font:14px/1.5 'Segoe UI',sans-serif;color:var(--h-ink);background:var(--h-bg);border:1px solid var(--h-line);border-radius:18px;overflow:hidden}
#habita-ui *{box-sizing:border-box}#habita-ui button,#habita-ui input,#habita-ui select,#habita-ui textarea{font:inherit}#habita-ui button{cursor:pointer;color:inherit}#habita-ui button:disabled{cursor:default;opacity:.5}#habita-ui button:focus-visible,#habita-ui input:focus-visible,#habita-ui select:focus-visible,#habita-ui textarea:focus-visible{outline:3px solid var(--h-green);outline-offset:3px}#habita-ui .h-demo{padding:8px 20px;background:var(--h-tint);color:var(--h-green);font-size:12px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}#habita-ui .h-shell{display:grid;grid-template-columns:185px minmax(0,1fr)}#habita-ui aside{background:var(--h-surface);border-right:1px solid var(--h-line);padding:24px 12px}#habita-ui .h-brand{font-size:24px;font-weight:600;letter-spacing:-.7px;display:flex;align-items:center;gap:10px;padding:0 10px 25px}#habita-ui .h-brand i{color:var(--h-green)}#habita-ui .h-eyebrow{text-transform:uppercase;letter-spacing:1.5px;font-size:11px;color:var(--h-dim)}#habita-ui nav{display:grid;gap:5px;margin:12px 0 30px}#habita-ui nav button{border:0;background:transparent;border-radius:9px;padding:11px 10px;text-align:left;display:flex;align-items:center;gap:9px}#habita-ui nav button[aria-current=page]{background:var(--h-tint);color:var(--h-green);font-weight:600}#habita-ui .h-contract{border-top:1px solid var(--h-line);padding:18px 8px;font-size:12px;color:var(--h-dim)}#habita-ui header{background:var(--h-surface);border-bottom:1px solid var(--h-line);padding:17px 23px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}#habita-ui .h-user{display:flex;align-items:center;gap:10px}#habita-ui .h-avatar{background:var(--h-tint);color:var(--h-green);border-radius:50%;padding:10px}#habita-ui main{padding:24px;min-width:0}#habita-ui h1{font-size:27px;letter-spacing:-.6px;margin:4px 0;font-weight:600}#habita-ui h2{font-size:16px;font-weight:600;margin:0 0 14px}#habita-ui h3{font-size:14px;margin:0;font-weight:600}#habita-ui p{margin:0}#habita-ui .h-muted,#habita-ui small{color:var(--h-dim)}#habita-ui small{font-size:12px;display:block}#habita-ui .h-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px;flex-wrap:wrap}#habita-ui .h-button{border:1px solid var(--h-line);border-radius:8px;padding:9px 12px;background:var(--h-surface);display:inline-flex;align-items:center;gap:7px;justify-content:center;text-decoration:none}#habita-ui .h-primary{background:var(--h-green);color:light-dark(#fff,#10281d);border-color:transparent}#habita-ui .h-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}#habita-ui .h-box{background:var(--h-surface);border:1px solid var(--h-line);border-radius:var(--h-radius);padding:18px;min-width:0}#habita-ui .h-grid{display:grid;grid-template-columns:1.2fr 1fr;gap:16px}#habita-ui .h-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:18px}#habita-ui .h-money{font-size:27px;font-weight:600;letter-spacing:-.5px;font-variant-numeric:tabular-nums;margin:6px 0}#habita-ui .h-row{padding:13px 0;border-bottom:1px solid var(--h-line);display:flex;justify-content:space-between;align-items:center;gap:12px}#habita-ui .h-row:last-child{border-bottom:0}#habita-ui .h-pill{display:inline-block;padding:4px 8px;font-size:11px;line-height:1.4;background:var(--h-tint);color:var(--h-green);border-radius:20px}#habita-ui .h-amber{background:var(--h-warn);color:var(--h-warntext)}#habita-ui .h-alert{padding:16px;background:var(--h-warn);color:var(--h-warntext);border-radius:12px;margin-bottom:18px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}#habita-ui .h-alert small{color:inherit}#habita-ui .h-tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:18px}#habita-ui .h-tabs button[aria-pressed=true]{background:var(--h-tint);color:var(--h-green);border-color:var(--h-green)}#habita-ui .h-track{height:9px;background:var(--h-bg);border-radius:8px;margin:12px 0;overflow:hidden}#habita-ui .h-track span{display:block;height:100%;background:var(--h-green)}#habita-ui .h-summary{background:var(--h-tint);align-self:start}#habita-ui label.h-field{display:grid;gap:6px;margin-bottom:14px;color:var(--h-dim)}#habita-ui input:not([type=checkbox]),#habita-ui select,#habita-ui textarea{width:100%;min-width:0;border:1px solid var(--h-line);border-radius:8px;background:var(--h-surface);color:var(--h-ink);padding:10px}#habita-ui input[type=checkbox]{width:18px;height:18px;accent-color:var(--h-green);flex-shrink:0}#habita-ui .h-check{display:flex;gap:10px;align-items:center;padding:12px 0}#habita-ui .h-calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}#habita-ui .h-day{min-height:43px;border:1px solid var(--h-line);border-radius:8px;background:var(--h-surface);padding:5px;position:relative;text-align:center}#habita-ui .h-day.h-mark{background:var(--h-tint)}#habita-ui .h-day[aria-pressed=true]{outline:2px solid var(--h-green);outline-offset:0}#habita-ui .h-week{font-size:11px;color:var(--h-dim);text-align:center;padding:5px}#habita-ui .h-dot{display:block;width:5px;height:5px;border-radius:50%;background:var(--h-green);margin:3px auto 0}#habita-ui .h-dateinfo{margin-top:14px;padding:12px;background:var(--h-bg);border-radius:8px}#habita-ui .h-table{width:100%;border-collapse:collapse}#habita-ui .h-table th,#habita-ui .h-table td{padding:12px 8px;text-align:left;border-bottom:1px solid var(--h-line)}#habita-ui .h-table th{font-size:12px;color:var(--h-dim);font-weight:500}#habita-ui .h-scroll{overflow-x:auto}#habita-ui details{margin-top:14px;border-top:1px solid var(--h-line);padding-top:12px}#habita-ui summary{cursor:pointer;color:var(--h-dim)}#habita-ui .h-paper{padding:22px;background:var(--h-surface);border:1px solid var(--h-line);border-radius:6px}#habita-ui .h-paper p{margin:14px 0}#habita-ui .h-notice{padding:12px 15px;border:1px solid var(--h-green);background:var(--h-tint);border-radius:9px;margin-bottom:16px}#habita-ui .h-error{color:var(--h-warntext);background:var(--h-warn);padding:9px;border-radius:6px;margin:10px 0}#habita-ui [hidden]{display:none!important}#habita-ui .h-back{margin-bottom:15px}#habita-ui svg{flex-shrink:0}
@media(max-width:760px){#habita-ui .h-shell{grid-template-columns:1fr}#habita-ui aside{padding:12px;border-right:0;border-bottom:1px solid var(--h-line)}#habita-ui .h-brand{padding:0 0 8px;font-size:21px}#habita-ui nav{display:flex;flex-wrap:wrap;margin:0;gap:4px}#habita-ui nav button{padding:9px;min-height:44px}#habita-ui aside .h-eyebrow,#habita-ui .h-contract{display:none}#habita-ui .h-grid{grid-template-columns:1fr}#habita-ui main{padding:17px}#habita-ui header{padding:13px 17px}}
@media(max-width:480px){#habita-ui .h-stats{grid-template-columns:1fr}#habita-ui .h-money{font-size:24px}#habita-ui .h-row{flex-wrap:wrap}#habita-ui .h-button{min-height:44px}#habita-ui input,#habita-ui select,#habita-ui textarea{font-size:16px!important}#habita-ui .h-box{padding:14px}#habita-ui header .h-user small{display:none}#habita-ui .h-calendar{gap:3px}}
</style>
<div class="h-demo"><span>Prototipo · Datos ficticios · Acciones solo de prueba</span><span>Los cambios se conservan durante esta vista</span></div>
<div class="h-shell"><aside><div class="h-brand"><i data-lucide="building-2" aria-hidden="true"></i>Habita</div><div class="h-eyebrow">Tu condominio</div><nav aria-label="Navegación principal"><button data-nav="inicio" aria-current="page"><i data-lucide="layout-dashboard" aria-hidden="true"></i>Resumen</button><button data-nav="finanzas"><i data-lucide="wallet" aria-hidden="true"></i>Finanzas</button><button data-nav="equipos"><i data-lucide="wrench" aria-hidden="true"></i>Mantenimiento</button><button data-nav="reservas"><i data-lucide="calendar-days" aria-hidden="true"></i>Reservas</button><button data-nav="asamblea"><i data-lucide="vote" aria-hidden="true"></i>Asambleas</button><button data-nav="documentos"><i data-lucide="folder-open" aria-hidden="true"></i>Documentos</button><button data-nav="avisos"><i data-lucide="bell" aria-hidden="true"></i>Comunicados</button></nav><div class="h-contract">Administradora vigente<br><strong>Gestión Urbana SAC</strong><br>Hasta 31 dic. 2027<br><br>3 torres · 96 departamentos</div></aside><div><header><div><strong>Los Jardines</strong><small>Junta de propietarios</small></div><div class="h-user"><span class="h-avatar">MT</span><div>María Torres<small>Presidenta</small></div></div></header><main><div id="h-feedback" role="status" hidden></div><div id="h-view"></div></main></div></div>
<script>
(()=>{
const root=document.getElementById('habita-ui'),view=root.querySelector('#h-view'),feedback=root.querySelector('#h-feedback');
const s={page:'inicio',tab:'pagos',paid:false,observed:false,agreement:'Pendiente de revisión',installments:4,meeting:'',attendance:[true,false,true],padron:['Propietario','Responsable','Propietario'],checks:[false,false,false],maintDone:false,resDay:14,maintDay:15,reservations:[],documents:[],announcements:[],deducted:false};
const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'S/ '+Number(n).toLocaleString('es-PE',{minimumFractionDigits:2,maximumFractionDigits:2});
const btn=(text,action,primary=false)=>`<button type="button" class="h-button ${primary?'h-primary':''}" data-act="${action}">${text}</button>`;
const badge=(text,warn=false)=>`<span class="h-pill ${warn?'h-amber':''}">${text}</span>`;
const row=(a,b,c)=>`<div class="h-row"><div><h3>${a}</h3><small>${b}</small></div>${c}</div>`;
const stat=(label,n,sub)=>`<div class="h-box"><span class="h-muted">${label}</span><div class="h-money">${n}</div><small>${sub}</small></div>`;
const head=(title,sub,action='')=>`<div class="h-head"><div><div class="h-eyebrow">Los Jardines</div><h1>${title}</h1><p class="h-muted">${sub}</p></div>${action}</div>`;
const back=()=>`<div class="h-back">${btn('← Volver','back')}</div>`;
const tabs=(items,selected)=>`<div class="h-tabs">${items.map(([id,name])=>`<button type="button" class="h-button" data-act="tab:${id}" aria-pressed="${selected===id}">${name}</button>`).join('')}</div>`;
function notice(text){feedback.className='h-notice';feedback.textContent=text;feedback.hidden=false}
function draw(html){view.innerHTML=html;if(globalThis.lucide)lucide.createIcons({attrs:{width:17,height:17}})}
function calendar(type,chosen,marked){return `<div class="h-calendar" aria-label="Septiembre de 2026">${['L','M','M','J','V','S','D'].map(x=>`<span class="h-week">${x}</span>`).join('')}<span></span>${Array.from({length:30},(_,i)=>{const d=i+1;return `<button type="button" class="h-day ${marked.includes(d)?'h-mark':''}" aria-label="${d} de septiembre${marked.includes(d)?', con actividad':''}" aria-pressed="${d===chosen}" data-act="day:${type}:${d}">${d}${marked.includes(d)?'<span class="h-dot"></span>':''}</button>`}).join('')}</div>`}
function navigate(page){s.page=page;feedback.hidden=true;root.querySelectorAll('[data-nav]').forEach(b=>{if(b.dataset.nav===page)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});render()}
function render(){
if(s.page==='inicio')draw(head('Tu condominio, al día.','Jueves 10 de septiembre de 2026')+`<div class="h-alert"><div><strong>${money(5000-(s.paid?300:0))} por cubrir en los próximos 30 días</strong><small>Compromisos: S/ 17 000 · Saldo operativo: ${money(12000+(s.paid?300:0))}</small></div>${btn('Explorar proyección','cash')}</div><div class="h-stats">${stat('Disponible operativo',money(12000+(s.paid?300:0)),'Sin fondos restringidos')}${stat('Cobranza de septiembre',money(24480+(s.paid?300:0)),'De S/ 28 800 emitidos')}${stat('Deuda vencida',money(8640),'Incluye meses anteriores')}</div><div class="h-grid"><section class="h-box"><h2>Decisiones pendientes</h2>${row('Convenio · A-402',s.agreement,btn('Revisar','agreement'))}${row('Pago · A-203',s.paid?'Confirmado':s.observed?'Observado':'Comprobante por validar',btn('Abrir','payment'))}${row('Garantía · A-105',s.deducted?'Devolución autorizada':'S/ 300 por devolver',btn('Revisar','guarantee'))}</section><section class="h-box"><h2>Próximos eventos</h2>${row('15 sep. · Ascensor A',s.maintDone?'Realizado · próximo 15 oct.':'Mantenimiento mensual',btn('Ver equipo','equipment'))}${row('20 sep. · Asamblea','19:00 · Modalidad mixta',btn('Gestionar','meeting'))}${row('25 sep. · Inventario',s.checks.filter(Boolean).length+' de 3 bienes revisados',btn('Inspeccionar','inventory'))}</section></div>`);
if(s.page==='finanzas'){draw(head('Finanzas','Pagos, acuerdos y proyección de caja.')+tabs([['pagos','Pagos'],['convenios','Convenios'],['caja','Proyección']],s.tab)+(s.tab==='convenios'?`<section class="h-box">${row('A-402 · Deuda S/ 1 200',s.agreement,btn('Revisar convenio','agreement'))}</section>`:s.tab==='caja'?cashHTML():`<section class="h-box"><div class="h-scroll"><table class="h-table"><thead><tr><th>Unidad</th><th>Importe</th><th>Estado</th><th></th></tr></thead><tbody><tr><td>A-203<small>Septiembre</small></td><td>S/ 300</td><td>${badge(s.paid?'Confirmado':s.observed?'Observado':'Por verificar',!s.paid)}</td><td>${btn('Revisar','payment')}</td></tr><tr><td>B-501<small>Septiembre</small></td><td>S/ 300</td><td>${badge('Conciliado')}</td><td>${btn('Ver sustento','receipt')}</td></tr></tbody></table></div></section>`))}
if(s.page==='equipos')draw(head('Mantenimiento e inventario','Equipos identificados, tareas verificables.')+tabs([['plan','Calendario'],['inventario','Inventario']],s.equipTab||'plan')+((s.equipTab||'plan')==='inventario'?inventoryHTML():`<div class="h-grid"><section class="h-box"><h2>Septiembre 2026</h2>${calendar('maint',s.maintDay,[15,18,25])}<small style="margin-top:12px">Días resaltados: actividades programadas</small></section><section class="h-box"><h2>${s.maintDay} de septiembre</h2>${s.maintDay===15?row('Ascensor · Torre A',s.maintDone?'Realizado':'Preventivo mensual',btn('Abrir ficha','equipment')):s.maintDay===18?row('Bomba principal','Inspección trimestral · garantía vigente',btn('Ver cobertura','pump')):s.maintDay===25?row('Inventario general','Revisión trimestral',btn('Iniciar revisión','inventory')):'<p class="h-muted">Sin tareas programadas para este día.</p>'}</section></div>`));
if(s.page==='reservas')draw(head('Espacios comunes','Reservas, cargos y garantías.',btn('Nueva reserva','newReservation',true))+`<div class="h-grid"><section class="h-box"><h2>Salón de eventos · Septiembre</h2>${calendar('res',s.resDay,[12,...s.reservations.map(x=>x.day)])}<small style="margin-top:12px">Resaltado: reserva registrada en el salón</small><div class="h-dateinfo">${s.resDay} sep. · ${s.resDay===12?'Ocupado: 16:00–22:00':s.reservations.some(x=>x.day===s.resDay)?'Solicitud pendiente de pago':'Disponible: 16:00–22:00'}</div></section><section class="h-box"><h2>Reservas y devoluciones</h2>${row('B-304 · Salón de eventos','12 sep. · Confirmada',btn('Ver desglose','reservation'))}${s.reservations.map(x=>row(esc(x.unit)+' · Salón',x.day+' sep. · '+money(x.total),badge('Pago pendiente',true))).join('')}${row('A-105 · Garantía','Uso finalizado · S/ 300',btn(s.deducted?'Ver autorización':'Revisar','guarantee'))}</section></div>`);
if(s.page==='asamblea')draw(head('Asambleas','Convocatorias, asistencia y representación.')+`<section class="h-box"><div class="h-head"><div>${badge('Convocada')}<h2 style="margin-top:12px">Pintura de áreas comunes</h2><p>20 sep. · 19:00 · Salón de eventos + virtual</p></div>${btn('Gestionar reunión','meeting',true)}</div><div class="h-stats">${stat('Asistencia de muestra',s.attendance.filter(Boolean).length+' / 3','Registro independiente del voto')}${stat('Enlace virtual',s.meeting?'Cargado':'Pendiente','Configuración manual')}${stat('Votación','Preparación','Sin apertura automática')}</div></section>`);
if(s.page==='documentos')draw(head('Archivo del condominio','Versiones, acceso y antecedentes.',btn('Cargar documento','upload',true))+`<section class="h-box">${row('Reglamento interno','Versión 2 · Propietarios',btn('Abrir','doc'))}${row('Contrato de administración','Hasta 31 dic. 2027 · Junta',btn('Ver contrato','contract'))}${s.documents.map(x=>row(esc(x.name),'Archivo seleccionado · '+esc(x.access),badge('Solo prototipo'))).join('')}</section>`);
if(s.page==='avisos')draw(head('Comunicados','Mensajes dirigidos a quienes corresponda.',btn('Nuevo comunicado','compose',true))+`<section class="h-box">${row('Limpieza de cisterna','22 sep. · Todo el condominio',btn('Ver comunicado','announcement'))}${s.announcements.map(x=>row(esc(x.title),esc(x.audience)+' · Sin envío real',badge('Borrador'))).join('')}</section>`)
}
function cashHTML(){return `<section class="h-box"><h2>Próximos 30 días</h2><div class="h-grid"><div>${row('Vigilancia','Comprometido',money(7000))}${row('Limpieza','Comprometido',money(4000))}${row('Ascensores','Comprometido',money(3200))}${row('Reparación de bomba','Comprometido',money(2800))}<label class="h-field" style="margin-top:16px">Cobros adicionales esperados · simulación<input id="h-expected" type="range" min="0" max="8640" step="100" value="0"></label></div><div class="h-box h-summary"><small>Brecha proyectada</small><div class="h-money" id="h-gap">${money(5000-(s.paid?300:0))}</div><p id="h-gaplabel">Falta cubrir</p>${row('Cobros simulados','No son saldo disponible','<strong id="h-extra">S/ 0</strong>')}<small>El escenario no modifica saldos ni emite cuotas.</small></div></div></section>`}
function inventoryHTML(){return `<section class="h-box"><div class="h-head"><h2>Revisión · 25 de septiembre</h2><span id="h-count">${s.checks.filter(Boolean).length} / 3 revisados</span></div><div class="h-track"><span id="h-progress" style="width:${s.checks.filter(Boolean).length/3*100}%"></span></div>${['ESC-01 · Escalera · Almacén','RAD-02 · Radio · Portería','MES-08 · Mesa · Salón'].map((x,i)=>`<label class="h-check"><input type="checkbox" data-check="${i}" ${s.checks[i]?'checked':''}><span>${x}<small>Confirmar existencia, ubicación y buen estado</small></span></label>`).join('')}<details><summary>Observaciones de la revisión</summary><label class="h-field">Detalle<textarea id="h-invnote" rows="2">${esc(s.invnote||'')}</textarea></label></details><div class="h-actions" style="margin-top:14px">${btn('Guardar avance','saveInventory',true)}</div></section>`}
function detail(type){feedback.hidden=true;
if(type==='cash'){draw(back()+head('Proyección de caja','Explora un escenario sin cambiar la contabilidad.')+cashHTML());return}
if(type==='inventory'){draw(back()+head('Inspección de inventario','Marca los bienes que has verificado.')+inventoryHTML());return}
if(type==='payment'){draw(back()+head('Verificar pago · A-203','Mantenimiento de septiembre')+`<div class="h-grid"><section class="h-box"><h2>Comprobante reportado</h2>${row('Importe','',money(300))}${row('Operación ficticia','9 sep. 2026','DEMO-0909')}${row('Adjunto','Evidencia de demostración',btn('Ver comprobante','voucher'))}</section><section class="h-box"><h2>Verificación bancaria</h2>${s.paid?badge('Confirmado y conciliado'):s.observed?badge('Observado',true):badge('Por verificar',true)}<form id="h-paymentform" style="margin-top:15px"><label class="h-field">Movimiento del banco<select name="movement" required ${s.paid?'disabled':''}><option value="">Selecciona una coincidencia</option><option value="demo">09 sep. · DEMO-0909 · S/ 300</option></select></label><label class="h-check"><input type="checkbox" name="verified" required ${s.paid?'disabled':''}>He verificado importe, operación y cuenta destino</label><label class="h-field">Observación<textarea name="note" rows="2" ${s.paid?'disabled':''}></textarea></label><div class="h-actions"><button class="h-button h-primary" ${s.paid?'disabled':''}>Confirmar pago</button>${s.paid?'':btn('Observar','observe')}</div></form></section></div>`);return}
if(type==='voucher'||type==='receipt'){draw(back()+head(type==='voucher'?'Comprobante de demostración':'Sustento del pago · B-501','Datos ficticios; no es un comprobante bancario válido.')+`<section class="h-paper"><div class="h-eyebrow">${type==='voucher'?'TRANSFERENCIA REPORTADA':'PAGO CONCILIADO'}</div><div class="h-money">S/ 300.00</div>${row('Operación','',type==='voucher'?'DEMO-0909':'DEMO-0908')}${row('Destino','','Cuenta del condominio')}${row('Aplicación','','Mantenimiento · septiembre')}${row('Estado','',badge(type==='voucher'?'Pendiente de verificación':'Verificado',type==='voucher'))}</section>`);return}
if(type==='agreement'){draw(back()+head('Convenio · A-402','Revisa la propuesta y su cronograma.')+`<div class="h-grid"><section class="h-box">${badge(s.agreement)}<form id="h-agreementform" style="margin-top:16px"><label class="h-field">Número de cuotas<select id="h-installments" name="count">${[2,3,4,6].map(n=>`<option ${n===s.installments?'selected':''}>${n}</option>`).join('')}</select></label><div id="h-schedule"></div><div class="h-actions" style="margin-top:16px"><button class="h-button h-primary">Aprobar propuesta</button>${btn('Solicitar ajuste','adjustAgreement')}</div></form></section><section class="h-box h-summary"><small>Deuda a regularizar</small><div class="h-money">S/ 1 200.00</div>${row('Intereses de este ejemplo','','S/ 0.00')}${row('Cuota mensual del convenio','','<strong id="h-installment"></strong>')}<small>Mantenimiento corriente por separado.</small><details><summary>Condiciones</summary><small>La aprobación queda pendiente de aceptación del solicitante. No se duplica ni elimina la deuda original.</small></details></section></div>`);schedule();return}
if(type==='equipment'||type==='pump'){const pump=type==='pump';draw(back()+head(pump?'BOM-01 · Bomba principal':'ASC-A-01 · Ascensor A',pump?'Cuarto de bombas · Bien del condominio':'Torre A · Bien del condominio')+`<div class="h-grid"><section class="h-box"><h2>Ficha y periodicidad</h2>${row('Frecuencia','',pump?'Trimestral':'Mensual · fecha fija')}${row('Próximo servicio','',pump?'18 sep. 2026':s.maintDone?'15 oct. 2026':'15 sep. 2026')}${row('Garantía','',pump?badge('Hasta dic. 2026'):badge('Fuera de garantía',true))}<details><summary>Historial de intervenciones</summary>${row('15 ago. 2026','Inspección completada',badge('Conforme'))}${row('15 jul. 2026','Servicio preventivo',badge('Conforme'))}</details></section><section class="h-box"><h2>${pump?'Gestión de cobertura':'Registrar ejecución'}</h2>${pump?`<p class="h-muted">Reparación cotizada: S/ 2 800</p><div style="margin-top:16px">${btn('Registrar revisión de garantía','warranty',true)}</div>`:`<form id="h-maintform"><label class="h-field">Fecha de ejecución<input type="date" name="date" value="2026-09-15" required></label><label class="h-field">Informe o referencia<input name="report" placeholder="Ej. Informe de servicio 015" required></label><label class="h-check"><input type="checkbox" required>Servicio ejecutado y revisado</label><button class="h-button h-primary" ${s.maintDone?'disabled':''}>${s.maintDone?'Ejecución registrada':'Registrar ejecución'}</button></form>`}</section></div>`);return}
if(type==='newReservation'){draw(back()+head('Nueva reserva','Salón de eventos · Bloque 16:00–22:00')+`<form id="h-resform"><div class="h-grid"><section class="h-box"><label class="h-field">Departamento<select name="unit"><option>A-203</option><option>B-304</option><option>C-202</option></select></label><label class="h-field">Fecha<input name="date" type="date" min="2026-09-10" max="2026-09-30" value="2026-09-${String(Math.max(10,s.resDay)).padStart(2,'0')}" required></label><h2>Servicios opcionales</h2><label class="h-check"><input type="checkbox" id="h-projector" name="projector">Proyector · S/ 40</label><label class="h-field">Mesas adicionales · S/ 10 cada una<select id="h-tables" name="tables"><option>0</option><option>1</option><option>2</option><option>3</option><option>4</option></select></label><label class="h-check"><input type="checkbox" required>Acepto las condiciones de uso y devolución</label><div id="h-reserror" role="alert"></div><button class="h-button h-primary">Crear solicitud de reserva</button></section><section class="h-box h-summary"><small>Total a pagar</small><div class="h-money" id="h-restotal">S/ 550.00</div>${row('Alquiler','','S/ 200.00')}${row('Limpieza obligatoria','','S/ 50.00')}${row('Servicios opcionales','','<span id="h-extras">S/ 0.00</span>')}${row('Garantía reembolsable','','S/ 300.00')}<small>Confirmación sujeta a verificación del pago.</small></section></div></form>`);return}
if(type==='reservation'){draw(back()+head('Reserva · B-304','12 sep. · Salón de eventos · 16:00–22:00')+`<div class="h-grid"><section class="h-box"><h2>Desglose</h2>${row('Alquiler','6 horas','S/ 200.00')}${row('Limpieza','Obligatoria','S/ 50.00')}${row('Garantía','Pendiente de devolución','S/ 300.00')}<details><summary>Condiciones de devolución</summary><small>Inspección al finalizar. Cualquier deducción requiere evidencia y aprobación.</small></details></section><section class="h-box h-summary">${badge('Confirmada')}<div class="h-money">S/ 550.00</div><small>Total recibido</small>${row('Saldo pendiente','','S/ 0.00')}${row('Ingreso por alquiler y limpieza','','S/ 250.00')}${row('Garantía retenida','','S/ 300.00')}</section></div>`);return}
if(type==='guarantee'){draw(back()+head('Devolver garantía · A-105','Salón de eventos · Reserva finalizada')+`<form id="h-guaranteeform"><div class="h-grid"><section class="h-box"><label class="h-field">Resultado de inspección<select id="h-inspection" name="inspection"><option value="ok">Sin daños · devolución completa</option><option value="damage">Con observación · devolución parcial</option></select></label><div id="h-deductionfields" hidden><label class="h-field">Deducción propuesta (S/)<input type="number" name="deduction" id="h-deduction" min="0" max="300" step="0.01" value="0"></label><label class="h-field">Motivo y referencia de evidencia<textarea name="reason" id="h-reason" rows="2"></textarea></label></div><label class="h-check"><input type="checkbox" required>Revisé la inspección y sus evidencias</label><button class="h-button h-primary" ${s.deducted?'disabled':''}>${s.deducted?'Ya autorizada':'Autorizar devolución'}</button></section><section class="h-box h-summary"><small>Por devolver</small><div class="h-money" id="h-refund">${money(s.refund===undefined?300:s.refund)}</div>${row('Depósito recibido','','S/ 300.00')}<small>Autorizar no ejecuta una transferencia bancaria.</small></section></div></form>`);return}
if(type==='meeting'){draw(back()+head('Gestionar asamblea','20 sep. · 19:00 · Modalidad mixta')+`<div class="h-grid"><section class="h-box"><h2>Acceso a la reunión</h2><form id="h-meetingform"><label class="h-field">Lugar<input value="Salón de eventos" readonly></label><label class="h-field">Enlace de Meet, Zoom u otra plataforma<input name="url" type="url" placeholder="https://…" value="${esc(s.meeting)}" required></label><button class="h-button h-primary">Guardar enlace</button></form><details><summary>Agenda</summary>${row('01','Presupuesto de pintura','')}${row('02','Comparación de proveedores','')}${row('03','Cuota extraordinaria','')}</details></section><section class="h-box"><h2>Asistencia · muestra</h2>${['A-101 · Ana Pérez','A-102 · Luis Soto','A-103 · Rosa Díaz'].map((n,i)=>`<label class="h-check"><input type="checkbox" data-att="${i}" ${s.attendance[i]?'checked':''}>${n}</label>`).join('')}<small id="h-attcount">${s.attendance.filter(Boolean).length} de 3 presentes</small><div style="margin-top:16px">${btn('Revisar quién vota','voters')}</div><details><summary>Votación y multas</summary><small>Votación todavía en preparación. No se generan multas automáticamente por ausencia.</small></details></section></div>`);return}
if(type==='voters'){draw(back()+head('Padrón de votación','Representación por unidad · muestra de tres unidades')+`<form id="h-votersform" class="h-box">${s.padron.map((v,i)=>`<label class="h-field">A-10${i+1} · Representante habilitado<select name="v${i}"><option ${v==='Propietario'?'selected':''}>Propietario</option><option ${v==='Responsable'?'selected':''}>Responsable</option></select></label>`).join('')}<label class="h-check"><input type="checkbox" required>He revisado las autorizaciones de representación</label><button class="h-button h-primary">Guardar padrón</button><small style="margin-top:12px">No abre una votación ni concede votos adicionales.</small></form>`);return}
if(type==='upload'){draw(back()+head('Cargar documento','Archivo privado del condominio')+`<form id="h-uploadform" class="h-box"><label class="h-field">Archivo<input name="file" type="file" accept=".pdf,.docx,.xlsx,.jpg,.png" required></label><label class="h-field">Quién puede consultarlo<select name="access"><option>Solo junta</option><option>Junta y administradora</option><option>Propietarios</option><option>Todos los residentes</option></select></label><button class="h-button h-primary">Añadir a la vista de prueba</button><small style="margin-top:12px">El archivo no se envía ni se almacena en un servidor.</small></form>`);return}
if(type==='doc'||type==='contract'){const contract=type==='contract';draw(back()+head(contract?'Contrato de administración':'Reglamento interno','Vista previa de demostración')+`<div class="h-grid"><section class="h-paper"><div class="h-eyebrow">Documento ficticio · ${contract?'Contrato':'Versión 2'}</div><h2 style="margin-top:20px">${contract?'Gestión Urbana SAC':'Uso de áreas comunes'}</h2>${row(contract?'Inicio':'Horario del salón','',contract?'01 ene. 2026':'Hasta las 22:00')}${row(contract?'Fin':'Reserva','',contract?'31 dic. 2027':'Pago y garantía')}${row(contract?'Acceso':'Recepción del espacio','',contract?'Temporal por trabajador':'Inspección documentada')}</section><section class="h-box"><h2>Control del documento</h2>${row('Acceso','',badge(contract?'Solo junta':'Propietarios'))}${row('Estado','',badge('Vigente'))}<details><summary>Versiones y antecedentes</summary>${row('Versión actual','Registrada en septiembre 2026',badge('Actual'))}${row('Versión anterior','Conservada para consulta',badge('Histórico'))}</details></section></div>`);return}
if(type==='compose'){draw(back()+head('Nuevo comunicado','Prepara el mensaje y define sus destinatarios.')+`<form id="h-composeform" class="h-box"><label class="h-field">Título<input name="title" maxlength="100" required placeholder="Ej. Corte programado de agua"></label><label class="h-field">Destinatarios<select name="audience"><option>Todo el condominio</option><option>Torre A</option><option>Torre B</option><option>Torre C</option></select></label><label class="h-field">Mensaje<textarea name="message" rows="4" required></textarea></label><button class="h-button h-primary">Guardar borrador</button><small style="margin-top:12px">No se enviarán correos ni notificaciones reales.</small></form>`);return}
if(type==='announcement')draw(back()+head('Limpieza de cisterna','Todo el condominio · Comunicado de ejemplo')+`<section class="h-box">${row('Fecha','','22 sep. 2026')}${row('Corte de agua','','09:00–12:00')}${row('Responsable','','Administración')}<details><summary>Mensaje completo</summary><p>Se realizará la limpieza programada de la cisterna. Prever el agua necesaria durante el horario indicado.</p></details></section>`)
}
function schedule(){const n=s.installments;root.querySelector('#h-installment').textContent=money(1200/n);root.querySelector('#h-schedule').innerHTML=Array.from({length:n},(_,i)=>row('Cuota '+(i+1),'Cada mes desde septiembre',money(1200/n))).join('')}
root.addEventListener('click',e=>{const nav=e.target.closest('[data-nav]');if(nav){navigate(nav.dataset.nav);return}const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;if(a==='back'){render();return}if(a.startsWith('tab:')){if(s.page==='equipos')s.equipTab=a.split(':')[1];else s.tab=a.split(':')[1];render();return}if(a.startsWith('day:')){const [,kind,d]=a.split(':');if(kind==='res')s.resDay=Number(d);else s.maintDay=Number(d);render();return}if(a==='observe'){const note=root.querySelector('[name=note]');if(!note.value.trim()){note.setCustomValidity('Indica el motivo de la observación.');note.reportValidity();note.setCustomValidity('');return}s.observed=true;detail('payment');notice('Pago observado en el prototipo. No se envió ningún aviso.');return}if(a==='adjustAgreement'){s.agreement='Ajuste solicitado';render();notice('Solicitud marcada para ajuste en esta vista.');return}if(a==='saveInventory'){s.invnote=root.querySelector('#h-invnote').value;notice('Avance de inventario guardado en esta vista.');return}if(a==='warranty'){notice('Revisión de garantía registrada en el prototipo. No se contactó al proveedor.');return}detail(a)});
root.addEventListener('input',e=>{if(e.target.id==='h-expected'){const extra=Number(e.target.value),gap=5000-(s.paid?300:0)-extra;root.querySelector('#h-extra').textContent=money(extra);root.querySelector('#h-gap').textContent=money(Math.abs(gap));root.querySelector('#h-gaplabel').textContent=gap>0?'Falta cubrir':gap===0?'Compromisos cubiertos':'Excedente simulado'}if(e.target.id==='h-deduction'){root.querySelector('#h-refund').textContent=money(300-Math.max(0,Math.min(300,Number(e.target.value))))}});
root.addEventListener('change',e=>{const t=e.target;if(t.id==='h-installments'){s.installments=Number(t.value);schedule()}if(t.matches('[data-check]')){s.checks[Number(t.dataset.check)]=t.checked;root.querySelector('#h-count').textContent=s.checks.filter(Boolean).length+' / 3 revisados';root.querySelector('#h-progress').style.width=s.checks.filter(Boolean).length/3*100+'%'}if(t.matches('[data-att]')){s.attendance[Number(t.dataset.att)]=t.checked;root.querySelector('#h-attcount').textContent=s.attendance.filter(Boolean).length+' de 3 presentes'}if(t.id==='h-projector'||t.id==='h-tables'){const extra=(root.querySelector('#h-projector').checked?40:0)+Number(root.querySelector('#h-tables').value)*10;root.querySelector('#h-extras').textContent=money(extra);root.querySelector('#h-restotal').textContent=money(550+extra)}if(t.id==='h-inspection'){const damage=t.value==='damage';root.querySelector('#h-deductionfields').hidden=!damage;root.querySelector('#h-reason').required=damage;root.querySelector('#h-deduction').min=damage?'0.01':'0';root.querySelector('#h-deduction').value='0';root.querySelector('#h-refund').textContent=money(300)}});
root.addEventListener('submit',e=>{e.preventDefault();const f=e.target,d=new FormData(f);if(f.id==='h-paymentform'){s.paid=true;s.observed=false;detail('payment');notice('Pago confirmado en esta vista. El resumen suma S/ 300 al saldo y a la cobranza.')}if(f.id==='h-agreementform'){s.agreement='Aprobado · falta aceptación';render();notice('Propuesta aprobada en el prototipo; requiere aceptación del solicitante.')}if(f.id==='h-maintform'){s.maintDone=true;detail('equipment');notice('Ejecución registrada en esta vista. Próximo servicio: 15 de octubre.')}if(f.id==='h-resform'){const day=Number(String(d.get('date')).slice(-2));if(day===12||s.reservations.some(x=>x.day===day)){const error=root.querySelector('#h-reserror');error.className='h-error';error.textContent='Este bloque ya tiene una reserva o solicitud. Elige otra fecha.';return}const total=550+(d.get('projector')?40:0)+Number(d.get('tables'))*10;s.reservations.push({day,unit:d.get('unit'),total});s.resDay=day;render();notice('Solicitud creada en esta vista. Pendiente de pago; aún no confirmada.')}if(f.id==='h-guaranteeform'){s.deducted=true;s.refund=300-(d.get('inspection')==='damage'?Number(d.get('deduction')):0);detail('guarantee');notice('Devolución de '+money(s.refund)+' autorizada en esta vista. No se transfirió dinero.')}if(f.id==='h-meetingform'){const url=String(d.get('url'));if(!/^https:\/\//i.test(url)){const el=f.querySelector('[name=url]');el.setCustomValidity('Utiliza un enlace HTTPS.');el.reportValidity();el.setCustomValidity('');return}s.meeting=url;notice('Enlace guardado en esta vista. No se creó una reunión externa.')}if(f.id==='h-votersform'){s.padron=s.padron.map((_,i)=>String(d.get('v'+i)));notice('Padrón de muestra actualizado. La votación permanece en preparación.')}if(f.id==='h-uploadform'){const file=d.get('file');s.documents.push({name:file.name,access:d.get('access')});render();notice('Documento añadido a la lista de prueba. No se subió el archivo.')}if(f.id==='h-composeform'){s.announcements.push({title:d.get('title'),audience:d.get('audience'),message:d.get('message')});render();notice('Borrador guardado en esta vista. No se enviaron mensajes.')}});
render();const design={radius:14,appearance:'Verde'};function restyle(){root.style.setProperty('--h-radius',design.radius+'px');root.style.setProperty('--h-green',design.appearance==='Azul'?'light-dark(#215c91,#9ecbfa)':'light-dark(#12684e,#89d8b6)');root.style.setProperty('--h-tint',design.appearance==='Azul'?'light-dark(#eaf1fa,#24364b)':'light-dark(#eaf4ee,#243d31)')};if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:restyle});tweak.addSlider(design,'radius',{label:'Redondeado',min:0,max:22,unit:'px'});tweak.addSelect(design,'appearance',{label:'Color principal',options:['Verde','Azul']})}
})();
</script>
